<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Stress-Test · Built Young</title>
<meta name="description" content="Answer six questions about your startup idea and get an honest report with a score out of 100.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --page: #FFF9F0;
  --paper: #FFFFFF;
  --ink: #241E17;
  --muted: #6E6457;
  --line: #EADFCF;
  --orange: #E8730C;
  --orange-soft: #FDEBD8;
  --teal: #0D9488;
  --teal-deep: #0B766C;
  --rust: #9A3412;
  --sans: "Plus Jakarta Sans", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 16px/1.6 var(--sans);
}
a { color: var(--teal-deep); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, .pill input:focus-visible + span {
  outline: 3px solid var(--orange);
  outline-offset: 2px;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
.brand { font-weight: 800; font-size: 18px; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.brand span { color: var(--orange); }
.lang {
  font: 600 14px var(--sans); color: var(--ink); background: transparent;
  border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.lang:hover { border-color: var(--ink); }

/* intro */
.intro { padding: 36px 0 28px; }
.intro h1 {
  font-size: clamp(40px, 7.5vw, 72px); line-height: 1.02; letter-spacing: -0.035em;
  font-weight: 800; margin: 0 0 20px; max-width: 12ch;
}
.intro p { font-size: 19px; color: var(--muted); margin: 0 0 14px; max-width: 58ch; }
.intro .note { font-size: 15px; }
.linkbtn {
  font: 600 15px var(--sans); color: var(--teal-deep); background: none; border: 0; padding: 0;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}

/* form */
form {
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 8px 28px 28px; margin-bottom: 40px;
}
.q { display: grid; grid-template-columns: 36px 1fr; gap: 0 14px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.q:last-of-type { border-bottom: 0; }
.q .n {
  font: 600 15px var(--mono); color: var(--orange); padding-top: 2px;
}
.q label.t, .q legend.t { font-weight: 700; font-size: 17px; line-height: 1.4; display: block; padding: 0; margin: 0 0 4px; }
.q .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.q .opt { color: var(--muted); font-weight: 500; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
textarea, input[type=text] {
  width: 100%; font: 400 16px/1.5 var(--sans); color: var(--ink);
  background: var(--page); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
textarea { min-height: 92px; resize: vertical; }
textarea::placeholder, input::placeholder { color: #A89C8C; }
textarea:focus, input[type=text]:focus { border-color: var(--orange); background: #fff; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.pill { position: relative; }
.pill input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pill span {
  display: inline-block; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 999px;
  font-size: 15px; font-weight: 500; background: var(--page); cursor: pointer; user-select: none;
}
.pill input:checked + span { background: var(--ink); border-color: var(--ink); color: #fff; }
.pill input:hover + span { border-color: var(--ink); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.submit-row { padding-top: 22px; }
.privacy { color: var(--muted); font-size: 13px; margin: 0 0 16px; max-width: 64ch; }
.primary {
  font: 700 17px var(--sans); color: #fff; background: var(--orange); border: 0;
  border-radius: 12px; padding: 15px 26px; cursor: pointer; width: 100%;
}
.primary:hover { background: #CF6408; }
.primary[disabled] { opacity: .6; cursor: progress; }
.field-error { color: var(--rust); font-size: 14px; font-weight: 600; margin: 8px 0 0; }

/* states */
.state {
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 28px; margin-bottom: 40px;
}
.state h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
.state p { margin: 0; color: var(--muted); }
.spinner {
  width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--orange-soft);
  border-top-color: var(--orange); animation: spin 0.9s linear infinite; margin-bottom: 16px;
}
.elapsed { font: 500 14px var(--mono); color: var(--muted); margin-top: 10px !important; }
@keyframes spin { to { transform: rotate(360deg); } }
.state.err { border-color: #F0C5A8; }
.state.err h2 { color: var(--rust); }

/* report */
.report { margin-bottom: 56px; }
.banner {
  background: var(--orange-soft); border-radius: 12px; padding: 12px 16px; font-size: 14px;
  font-weight: 500; margin-bottom: 24px;
}
.report h2.title {
  font-size: clamp(30px, 5.2vw, 44px); line-height: 1.1; letter-spacing: -0.03em; font-weight: 800; margin: 0 0 24px;
}
.understood { border-left: 3px solid var(--line); padding: 2px 0 2px 18px; margin-bottom: 36px; }
.understood h3 { font-size: 15px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
.understood ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 15px; }
.understood .gaps { margin-top: 10px; color: var(--rust); font-size: 14px; font-weight: 500; }
.sec { padding: 28px 0; border-top: 1.5px solid var(--line); }
.sec h3 { font-size: 23px; letter-spacing: -0.015em; margin: 0 0 12px; font-weight: 800; }
.sec h3 .e { margin-right: 6px; }
.sec p { margin: 0 0 12px; max-width: 68ch; }
.sec p:last-child { margin-bottom: 0; }
.lede { font-size: 19px; font-weight: 600; line-height: 1.5; }
.lbl { font-weight: 700; }
.comp { list-style: none; padding: 0; margin: 0 0 14px; }
.comp li { padding: 10px 0; border-bottom: 1px dashed var(--line); }
.comp li:last-child { border-bottom: 0; }
.comp .src { font-size: 13px; margin-left: 6px; white-space: nowrap; }
.quote {
  background: var(--page); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
  font-weight: 500; margin: 0 0 12px; max-width: 68ch;
}
.sec ul.plain { margin: 0 0 12px; padding-left: 20px; }

/* score: the one loud element */
.scorehead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 18px; margin: 4px 0 18px; }
.big { font: 600 clamp(84px, 16vw, 128px)/0.9 var(--mono); letter-spacing: -0.05em; color: var(--ink); }
.big small { font-size: 0.26em; letter-spacing: 0; color: var(--muted); margin-left: 4px; }
.verdict {
  font-weight: 800; font-size: 15px; letter-spacing: 0.02em; color: #fff; border-radius: 999px; padding: 7px 14px;
}
.v-build { background: var(--teal); }
.v-narrow { background: var(--orange); }
.v-notyet { background: var(--rust); }
.bar { display: flex; gap: 3px; height: 22px; margin: 0 0 6px; }
.seg { background: var(--orange-soft); border-radius: 4px; overflow: hidden; position: relative; }
.seg i { display: block; height: 100%; background: var(--orange); }
.barlabels { display: flex; gap: 3px; margin-bottom: 20px; }
.barlabels span { font-size: 12px; color: var(--muted); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; margin: 0 0 18px; font-size: 15px; }
th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 8px 8px 8px 0; border-bottom: 1.5px solid var(--line); }
td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.pts { font: 600 15px var(--mono); white-space: nowrap; }
td.name { font-weight: 600; white-space: nowrap; }
th:nth-child(2), td.pts { width: 72px; }
th:first-child { width: 150px; }
.advice { background: var(--page); border-radius: 12px; padding: 14px 16px; margin-top: 6px; font-weight: 500; }

.cta {
  background: var(--teal); color: #fff; border-radius: 18px; padding: 26px 28px; margin: 28px 0 8px;
}
.cta h3 { margin: 0 0 10px; font-size: 22px; letter-spacing: -0.01em; }
.cta p { margin: 0 0 8px; max-width: 64ch; }
.cta a { color: #fff; font-weight: 700; word-break: break-word; }
.sources { padding-top: 24px; }
.sources h3 { font-size: 15px; color: var(--muted); margin: 0 0 6px; }
.sources ol { margin: 0; padding-left: 20px; font-size: 14px; }
.sources li { margin-bottom: 4px; word-break: break-word; }
.again {
  margin-top: 28px; font: 700 16px var(--sans); color: var(--ink); background: transparent;
  border: 1.5px solid var(--ink); border-radius: 12px; padding: 12px 20px; cursor: pointer;
}
.again:hover { background: var(--ink); color: #fff; }

footer { color: var(--muted); font-size: 13px; padding: 24px 0 48px; border-top: 1px solid var(--line); }
footer a { color: var(--muted); }

@media (max-width: 600px) {
  .wrap { padding: 0 16px; }
  form { padding: 4px 18px 20px; }
  .q { grid-template-columns: 1fr; }
  .q .n { padding: 0 0 4px; }
  .state, .cta { padding: 22px 20px; }
  .barlabels { display: none; }
  .bar { margin-bottom: 18px; }
  td.name { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; border-top-color: var(--orange); }
}
@media print {
  .top .lang, form, .again, .intro { display: none !important; }
  body { background: #fff; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="https://builtyoung.org/">Built Young<span>.</span></a>
    <button class="lang" id="langBtn" type="button" aria-label="Switch language">中文</button>
  </header>

  <main>
    <section class="intro" id="intro">
      <h1 data-t="hero_title"></h1>
      <p data-t="hero_sub"></p>
      <p class="note"><span data-t="hero_note"></span> <button type="button" class="linkbtn" id="sampleBtn" data-t="sample_link"></button></p>
    </section>

    <form id="form" novalidate>
      <div class="q">
        <span class="n" aria-hidden="true">1</span>
        <div>
          <label class="t" for="idea" data-t="q1"></label>
          <p class="hint" data-t="q1_hint"></p>
          <textarea id="idea" name="idea" maxlength="1200" data-ph="q1_ph" aria-describedby="ideaErr" required></textarea>
          <p class="field-error" id="ideaErr" hidden data-t="err_idea"></p>
        </div>
      </div>
      <div class="q">
        <span class="n" aria-hidden="true">2</span>
        <div>
          <label class="t" for="customer" data-t="q2"></label>
          <p class="hint" data-t="q2_hint"></p>
          <input type="text" id="customer" name="customer" maxlength="600" data-ph="q2_ph">
        </div>
      </div>
      <div class="q">
        <span class="n" aria-hidden="true">3</span>
        <div>
          <label class="t" for="problem" data-t="q3"></label>
          <p class="hint" data-t="q3_hint"></p>
          <textarea id="problem" name="problem" maxlength="1200" data-ph="q3_ph"></textarea>
        </div>
      </div>
      <div class="q">
        <span class="n" aria-hidden="true">4</span>
        <div>
          <label class="t" for="real_person" data-t="q4"></label>
          <p class="hint" data-t="q4_hint"></p>
          <input type="text" id="real_person" name="real_person" maxlength="600" data-ph="q4_ph">
        </div>
      </div>
      <div class="q">
        <span class="n" aria-hidden="true">5</span>
        <fieldset>
          <legend class="t" data-t="q5"></legend>
          <div class="pills" id="stagePills"></div>
        </fieldset>
      </div>
      <div class="q">
        <span class="n" aria-hidden="true">6</span>
        <fieldset>
          <legend class="t" data-t="q6"></legend>
          <div class="pills" id="moneyPills"></div>
        </fieldset>
      </div>
      <div class="q">
        <span class="n" aria-hidden="true">+</span>
        <div>
          <label class="t" for="details"><span data-t="q7"></span> <span class="opt" data-t="optional"></span></label>
          <p class="hint" data-t="q7_hint"></p>
          <textarea id="details" name="details" maxlength="4000"></textarea>
        </div>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>
      <div class="submit-row">
        <p class="privacy" data-t="privacy"></p>
        <button class="primary" id="submitBtn" type="submit" data-t="submit"></button>
      </div>
    </form>

    <section class="state" id="loading" hidden aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h2 data-t="loading_title"></h2>
      <p data-t="loading_body"></p>
      <p class="elapsed" id="elapsed"></p>
    </section>

    <section class="state err" id="error" hidden role="alert">
      <h2 data-t="error_title"></h2>
      <p id="errorMsg"></p>
    </section>

    <article class="report" id="report" hidden tabindex="-1"></article>
  </main>

  <footer>
    <span data-t="footer"></span>
    <a href="https://github.com/BuiltYoung/idea-stress-test">idea-stress-test</a>
  </footer>
</div>

const LINE_ORDER = ["problem_who", "real_person", "substitute", "demand", "money", "reach", "build"];
const DB_URL = "https://github.com/BuiltYoung/challenge_startup_coach";
const BY_URL = "https://builtyoung.org/";

const SAMPLE = {
  language: "en",
  idea_name: "Echo (回响)",
  intake_summary: [

      { name: "Meetup, Luma and Bumble BFF", what: "r/askTO's usual tips for meeting people in Toronto. The events are real, but they run in English and aren't their community.", source_url: "https://redlib.cypherpunktools.com/r/askTO/comments/1jpkx7l/megathread_how_to_make_friends_in_toronto" },

      { name: "DMeet 直面", what: "A Chinese-language app with 搭子 matching, dating and offline events, plus real-name checks.", source_url: "https://apps.apple.com/us/app/id6753893655" }

    { title: "DMeet 直面 (App Store)", url: "https://apps.apple.com/us/app/id6753893655" },
    { title: "Tasting Table on Timeleft", url: "https://www.tastingtable.com/1859085/dinner-parties-with-strangers-timeleft" },
    { title: "Timeleft dinner review (Toronto)", url: "https://seeyounexttuesdaymedia.com/articles/timeleft-dinner-review" },

    { title: "小红书 找搭子 (界面新闻)", url: "https://www.jiemian.com/article/10185990.html" }

/* ---------- state ---------- */
let uiLang = "en";
try { if ((localStorage.getItem("by_lang") || "") === "zh") uiLang = "zh"; } catch (e) {}
let lastReport = null, lastBanner = null;

const $ = (id) => document.getElementById(id);
const form = $("form"), loading = $("loading"), errBox = $("error"), reportEl = $("report");

/* Build DOM safely: every string goes in as text, never as HTML. */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === "") continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u)) ? u : null;
const extLink = (url, text) => safeUrl(url) ? el("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, text) : null;
const s = (v) => (typeof v === "string" ? v.trim() : "");

/* ---------- i18n ---------- */
function applyLang() {
  const t = T[uiLang];
  document.documentElement.lang = uiLang === "zh" ? "zh-CN" : "en";
  $("langBtn").textContent = t.toggle;
  document.querySelectorAll("[data-t]").forEach((n) => {
    const v = t[n.dataset.t];
    if (typeof v === "string") n.textContent = v;
  });
  document.querySelectorAll("[data-ph]").forEach((n) => { n.placeholder = t[n.dataset.ph] || ""; });
  buildPills("stagePills", "stage", t.stage);
  buildPills("moneyPills", "money", t.money);
  $("sampleBtn").hidden = !CONFIG.SHOW_SAMPLE_LINK;
  if (lastReport) renderReport(lastReport, lastBanner);
}
function buildPills(id, name, labels) {
  const box = $(id);
  const current = (form.querySelector(`input[name=${name}]:checked`) || {}).value;
  box.textContent = "";
  for (const [value, label] of Object.entries(labels)) {
    const input = el("input", { type: "radio", name, value, id: `${name}-${value}` });
    if (value === current) input.checked = true;
    box.append(el("label", { class: "pill", for: `${name}-${value}` }, input, el("span", {}, label)));
  }
}
$("langBtn").addEventListener("click", () => {
  uiLang = uiLang === "en" ? "zh" : "en";
  try { localStorage.setItem("by_lang", uiLang); } catch (e) {}
  applyLang();
});

/* ---------- report ---------- */
function verdictFor(total) { return total >= 70 ? "BUILD IT" : total >= 40 ? "NARROW IT" : "NOT YET"; }

function normaliseScore(score) {
  const maxes = { problem_who: 15, real_person: 20, substitute: 15, demand: 15, money: 15, reach: 10, build: 10 };
  const byId = {};
  for (const l of (score && score.lines) || []) if (!byId[l.line]) byId[l.line] = l;
  const lines = LINE_ORDER.map((id) => {
    const l = byId[id] || {};
    const max = maxes[id];
    return { line: id, max, score: Math.max(0, Math.min(max, Math.round(Number(l.score) || 0))), why: s(l.why) };
  });
  const total = lines.reduce((a, l) => a + l.score, 0);
  return { lines, total, verdict: verdictFor(total) };
}

function section(emoji, num, title, ...body) {
  return el("section", { class: "sec" },
    el("h3", {}, el("span", { class: "e", "aria-hidden": "true" }, emoji), `${num}. ${title}`),
    ...body);
}
const labelled = (label, text) => s(text) ? el("p", {}, el("span", { class: "lbl" }, label), " ", s(text)) : null;

function renderReport(r, banner) {
  const L = T[r.language === "zh" ? "zh" : "en"];
  const sc = normaliseScore(r.score);
  const vClass = sc.verdict === "BUILD IT" ? "v-build" : sc.verdict === "NARROW IT" ? "v-narrow" : "v-notyet";
  reportEl.textContent = "";

  if (banner) reportEl.append(el("div", { class: "banner" }, T[uiLang][banner]));
  reportEl.append(el("h2", { class: "title" }, `${s(r.idea_name) || "Your idea"}${L.title_suffix}`));

  const summary = (r.intake_summary || []).map(s).filter(Boolean);
  const gaps = (r.unanswered || []).map(s).filter(Boolean);
  if (summary.length || gaps.length) {
    reportEl.append(el("div", { class: "understood" },
      el("h3", {}, L.understood),
      summary.length ? el("ul", {}, summary.map((x) => el("li", {}, x))) : null,
      gaps.length ? el("p", { class: "gaps" }, `${L.gaps} ${gaps.join("; ")}`) : null));
  }

  const f = r.idea_fit || {};
  reportEl.append(section("🔍", 1, L.s1,
    el("p", { class: "lede" }, s(f.sentence)),
    s(f.fit) ? el("p", {}, s(f.fit)) : null,
    labelled(L.gap, f.biggest_gap),
    labelled(L.safety, f.safety_note)));

  const c = r.competitors || {};
  reportEl.append(section("📊", 2, L.s2,
    el("ul", { class: "comp" }, (c.items || []).map((it) => el("li", {},
      el("span", { class: "lbl" }, s(it.name)), " ", s(it.what),
      safeUrl(it.source_url) ? el("span", { class: "src" }, "(", extLink(it.source_url, L.source), ")") : null))),
    s(c.edge) ? el("p", {}, s(c.edge)) : null));

  const o = r.opportunity || {};
  reportEl.append(section("✨", 3, L.s3,
    s(o.wedge) ? el("p", {}, s(o.wedge)) : null,
    labelled(L.why_here, o.why_start_here),
    labelled(L.money_signal, o.money_signal)));

  const bar = el("div", { class: "bar", "aria-hidden": "true" },
    sc.lines.map((l) => el("div", { class: "seg", style: `flex:${l.max}`, title: `${L.lines[l.line]} ${l.score}/${l.max}` },
      el("i", { style: `width:${(l.score / l.max) * 100}%` }))));
  const labels = el("div", { class: "barlabels", "aria-hidden": "true" },
    sc.lines.map((l) => el("span", { style: `flex:${l.max}` }, L.lines[l.line])));
  const table = el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, L.th_line), el("th", {}, L.th_score), el("th", {}, L.th_why))),
    el("tbody", {}, sc.lines.map((l) => el("tr", {},
      el("td", { class: "name" }, L.lines[l.line]),
      el("td", { class: "pts" }, `${l.score}/${l.max}`),
      el("td", {}, l.why)))));
  const sr = r.score || {};
  reportEl.append(section("📈", 4, L.s4,
    el("div", { class: "scorehead" },
      el("div", { class: "big", "aria-label": `${sc.total} out of 100` }, String(sc.total), el("small", {}, L.out_of)),
      el("span", { class: `verdict ${vClass}` }, L.verdicts[sc.verdict])),
    bar, labels, table,
    labelled(L.holding, sr.holding_back),
    labelled(L.raise, sr.raise_most),
    s(sr.verdict_advice) ? el("div", { class: "advice" }, s(sr.verdict_advice)) : null));

  const tg = r.targeting || {};
  const listen = (tg.listen_for || []).map(s).filter(Boolean);
  reportEl.append(section("🎯", 5, L.s5,
    labelled(L.start_with, tg.start_with),
    labelled(L.gather, tg.where_they_gather),
    s(tg.opener) ? el("p", {}, el("span", { class: "lbl" }, L.opener)) : null,
    s(tg.opener) ? el("div", { class: "quote" }, s(tg.opener)) : null,
    listen.length ? el("p", {}, el("span", { class: "lbl" }, L.listen)) : null,
    listen.length ? el("ul", { class: "plain" }, listen.map((x) => el("li", {}, x))) : null));

  const ot = r.one_thing || {};
  reportEl.append(section("💡", 6, L.s6,
    s(ot.step) ? el("p", { class: "lede" }, s(ot.step)) : null,
    labelled(L.pass, ot.pass_bar),
    labelled(L.miss, ot.if_it_misses)));

  reportEl.append(el("aside", { class: "cta" },
    el("h3", {}, "🚀 ", L.cta_title),
    el("p", {}, L.cta_1, extLink(DB_URL, DB_URL)),
    el("p", {}, L.cta_2a, extLink(BY_URL, BY_URL), L.cta_2b)));

  const srcs = (r.sources || []).filter((x) => safeUrl(x.url));
  if (srcs.length) {
    reportEl.append(el("div", { class: "sources" },
      el("h3", {}, L.sources),
      el("ol", {}, srcs.map((x) => el("li", {}, extLink(x.url, s(x.title) || x.url))))));
  }

  const again = el("button", { class: "again", type: "button" }, T[uiLang].again);
  again.addEventListener("click", resetToForm);
  reportEl.append(again);
}

/* ---------- flow ---------- */
let timer = null;
function show(which) {
  form.hidden = which !== "form";
  $("intro").hidden = which === "report";
  loading.hidden = which !== "loading";
  reportEl.hidden = which !== "report";
  if (which !== "error-inline") errBox.hidden = true;
}
function startLoading() {
  show("loading");
  const t0 = Date.now();
  $("elapsed").textContent = T[uiLang].elapsed(0);
  timer = setInterval(() => { $("elapsed").textContent = T[uiLang].elapsed(Math.round((Date.now() - t0) / 1000)); }, 1000);
  loading.scrollIntoView({ block: "start" });
}
function stopLoading() { clearInterval(timer); timer = null; }
function showReport(r, banner) {
  stopLoading();
  lastReport = r; lastBanner = banner;
  renderReport(r, banner);
  show("report");
  window.scrollTo({ top: 0 });
  reportEl.focus({ preventScroll: true });
}
function showError(key) {
  stopLoading();
  show("form");
  $("errorMsg").textContent = T[uiLang][key] || T[uiLang].error_generic;
  errBox.hidden = false;
  form.parentNode.insertBefore(errBox, form);
  errBox.scrollIntoView({ block: "start" });
  setBusy(false);
}
function setBusy(busy) {
  const b = $("submitBtn");
  b.disabled = busy;
  b.textContent = busy ? T[uiLang].submitting : T[uiLang].submit;
}
function resetToForm() {
  lastReport = null; lastBanner = null;
  show("form");
  setBusy(false);
  window.scrollTo({ top: 0 });
}

$("sampleBtn").addEventListener("click", () => showReport(SAMPLE, "banner_sample"));

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const answers = {
    idea: s(fd.get("idea")), customer: s(fd.get("customer")), problem: s(fd.get("problem")),
    real_person: s(fd.get("real_person")), stage: s(fd.get("stage")), money: s(fd.get("money")),
    details: s(fd.get("details"))
  };
  const ideaErr = $("ideaErr");
  if (answers.idea.length < 10) {
    ideaErr.hidden = false;
    $("idea").setAttribute("aria-invalid", "true");
    $("idea").focus();
    return;
  }
  ideaErr.hidden = true;
  $("idea").removeAttribute("aria-invalid");
  setBusy(true);
  startLoading();

  if (!CONFIG.API_URL) {
    setTimeout(() => { setBusy(false); showReport(SAMPLE, "banner_preview"); }, 1200);
    return;
  }

  const ctrl = new AbortController();
  const killer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try {
    const headers = { "content-type": "application/json" };
    if (CONFIG.API_KEY) { headers.authorization = `Bearer ${CONFIG.API_KEY}`; headers.apikey = CONFIG.API_KEY; }
    const res = await fetch(CONFIG.API_URL, {
      method: "POST", headers, signal: ctrl.signal,
      body: JSON.stringify({ answers, ui_lang: uiLang, website: s(fd.get("website")) })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.report) {
      const map = { rate_limited: "error_rate", idea_required: "error_idea", refused: "error_refused" };
      throw new Error(map[data.error] || "error_generic");
    }
    setBusy(false);
    showReport(data.report, null);
  } catch (err) {
    showError(err.name === "AbortError" ? "error_timeout" : (T.en[err.message] ? err.message : "error_generic"));
  } finally {
    clearTimeout(killer);
  }
});

applyLang();
setBusy(false);
</script>
